# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: esphome-c
  friendly_name: ESPHome-C
  includes:
    - cc1101.h
  libraries:
    - SPI
    - "SmartRC-CC1101-Driver-Lib"

esp32:
  variant: esp32
  framework:
    type: esp-idf

api:
  encryption:
    key: "8kyiJqMFxPzK9J5gnQkzWaRzzOMQZSNWvw0EmgXJIgI="

ota:
  - platform: esphome

wifi:
  fast_connect: true
  power_save_mode: HIGH
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESPHome-C Fallback Hotspot
    password: "JujbeL9kPflC"

logger:
  level: VERBOSE

web_server:
  port: 80

number:
  - platform: template
    max_value: 812
    min_value: 58
    step: 1
    mode: slider
    optimistic: true
    unit_of_measurement: "kHz"
    name: BW
    on_value:
      then:
        - lambda: get_cc1101(transciver).setBW(x);
  - platform: template
    # if your cc1101 board is tuned for ~320MHz
    # min_value: 300
    # max_value: 348

    # if your cc1101 board is tuned for ~433MHz
    min_value: 378
    max_value: 464

    # if your cc1101 board is tuned for ~868Hz
    # min_value: 799
    # max_value: 928

    step: .001
    mode: box
    optimistic: true
    unit_of_measurement: "MHz"
    name: FREQ
    on_value:
      then:
        - lambda: get_cc1101(transciver).setFreq(x);

spi:
  - id: spi_1
    clk_pin: 18
    miso_pin: 19
    mosi_pin: 23          

cc1101:
  - id: cc1101_1
    cs_pin: GPIO5
      
remote_transmitter:
  - id: transmitter
    pin:
      number: 32 # This is GDO0
      allow_other_uses: true
    carrier_duty_percent: 100%

remote_receiver:
  - id: receiver
    pin:
      number: 32 # This is GDO0
      allow_other_uses: true
      # on the esp8266 use any of D1,D2,D5,D6,D7,Rx
      # Don't use D3,D4,D8,TX, boot often fails.
      # Can't be D0 or GPIO17 b/c no interrupts
    dump:
      - raw
binary_sensor:
  - platform: remote_receiver
    name: Garage
    raw:
      # prettier-ignore
      code: [990,-330,330,-990,990,-330,330,-990,330,-990,330,-990,330,-990,330,-990,330,-990,990,-330,330,-990,990,-330,330,-990,330,-990,330,-990,330,-990,330,-990,330,-990,990,-330,990,-330,330,-990,330,-990,990,-330,330,-990,330]
switch:
  - platform: template
    name: "RSSI"
    entity_category: diagnostic
    lambda: return get_cc1101(transciver).rssi_on;
    turn_on_action:
      lambda: get_cc1101(transciver).rssi_on = true;
    turn_off_action:
      lambda: get_cc1101(transciver).rssi_on = false;

button:
  - platform: template
    name: Garage
    on_press:
      - lambda: get_cc1101(transciver).beginTransmission();
      - remote_transmitter.transmit_raw:
          # prettier-ignore
          code: [990,-330,330,-990,990,-330,330,-990,330,-990,330,-990,330,-990,330,-990,330,-990,990,-330,330,-990,990,-330,330,-990,330,-990,330,-990,330,-990,330,-990,330,-990,990,-330,990,-330,330,-990,330,-990,990,-330,330,-990,330]
          repeat:
            times: 3
            wait_time: 4.733ms
      - lambda: get_cc1101(transciver).endTransmission();

#END
